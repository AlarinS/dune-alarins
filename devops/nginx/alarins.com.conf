server {
  listen 80;
  listen [::]:80;
  server_name alarins.com;
    include /etc/nginx/snippets/dune-admin-next.conf;
  # fallback for Next runtime
  location @next_runtime {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
    proxy_connect_timeout 5s;
    proxy_hide_header X-Powered-By;
    add_header X-Powered-By "";
  }
    include /etc/nginx/snippets/dune-admin-next-pin.conf;
    include /etc/nginx/snippets/dune-admin-next.conf;
    include /etc/nginx/snippets/dune-admin-next-pin.conf;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name alarins.com;

  ssl_certificate     /etc/nginx/live/alarins.com.crt;
  ssl_certificate_key /etc/nginx/live/alarins.com.key;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;


  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
    proxy_connect_timeout 5s;

    proxy_hide_header X-Powered-By;
    add_header X-Powered-By "";
  }
}
